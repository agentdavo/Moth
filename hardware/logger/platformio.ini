; Sailing datalogger (sail-log v1). See README.md and ../../docs/LOG_FORMAT.md
;
;   pio run                      build the default target (XIAO ESP32S3)
;   pio run -e devkitc           build for an ESP32-S3-DevKitC-1
;   pio run -t upload            flash the default target
;   pio device monitor           115200 baud status output over USB
;
; Pure logic lives in lib/saillog and is unit tested on the host with
;   make -C test_host

[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
build_unflags = -std=gnu++11
; SAILLOG_SPORT=0 compiles out the FrSky S.Port telemetry emulation.
build_flags =
    -std=gnu++17
    -Wall
    -DFW_VERSION=\"1.0.0\"
    -DSAILLOG_SPORT=1

; Seeed Studio XIAO ESP32S3 (21 x 17.8 mm, 1S LiPo charger on board).
; Edge pins D0..D10 plus the four JTAG pads on the underside (GPIO39..42).
;   D4=GPIO5 SDA, D5=GPIO6 SCL, D7=GPIO44 GNSS TX in, D6=GPIO43 GNSS RX out,
;   D8/D9/D10=GPIO7/8/9 SD SCK/MISO/MOSI, D2=GPIO3 SD CS, D0=GPIO1 rudder,
;   D1=GPIO2 sheet, D3=GPIO4 VBAT divider, pads MTCK=39 aux1, MTDO=40 aux2,
;   MTDI=41 event button, MTMS=42 S.Port, GPIO21 on-board LED (active low).
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"xiao_esp32s3\"
    -DPIN_I2C_SDA=5
    -DPIN_I2C_SCL=6
    -DPIN_IMU_RST=-1
    -DPIN_GNSS_RX=44
    -DPIN_GNSS_TX=43
    -DPIN_SD_SCK=7
    -DPIN_SD_MISO=8
    -DPIN_SD_MOSI=9
    -DPIN_SD_CS=3
    -DPIN_RUDDER=1
    -DPIN_SHEET=2
    -DPIN_AUX1=39
    -DPIN_AUX2=40
    -DPIN_VBAT=4
    -DPIN_BUTTON=41
    -DPIN_SPORT=42
    -DPIN_LED=21
    -DLED_ACTIVE_LOW=1

; Espressif ESP32-S3-DevKitC-1 (bench rig, or a Moth build with more room).
; GPIO0 is the BOOT button and doubles as the event button.
; The on-board WS2812 is GPIO48 (GPIO38 on board revision 1.1).
[env:devkitc]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32s3_devkitc1\"
    -DPIN_I2C_SDA=8
    -DPIN_I2C_SCL=9
    -DPIN_IMU_RST=-1
    -DPIN_GNSS_RX=18
    -DPIN_GNSS_TX=17
    -DPIN_SD_SCK=12
    -DPIN_SD_MISO=13
    -DPIN_SD_MOSI=11
    -DPIN_SD_CS=10
    -DPIN_RUDDER=4
    -DPIN_SHEET=5
    -DPIN_AUX1=6
    -DPIN_AUX2=7
    -DPIN_VBAT=1
    -DPIN_BUTTON=0
    -DPIN_SPORT=16
    -DPIN_LED=48
    -DLED_IS_RGB=1
