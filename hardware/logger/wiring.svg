<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Sailing datalogger wiring (XIAO ESP32S3 default build)</title>
  <!-- Explicit background so the drawing reads the same in light and dark viewers -->
  <rect x="0" y="0" width="1100" height="860" fill="#ffffff"/>
  <rect x="6" y="6" width="1088" height="848" rx="10" fill="none" stroke="#c9d1db" stroke-width="2"/>

  <text x="30" y="42" font-size="22" font-weight="bold" fill="#111111">Sailing datalogger wiring: Seeed XIAO ESP32S3 (default build)</text>
  <text x="30" y="66" font-size="13" fill="#444444">Schematic, not physical pin order. GPIO39-42 are the JTAG pads on the underside of the XIAO. Crossing lines without a dot are not connected.</text>

  <!-- ===================== wires (drawn first, under the boxes) ===================== -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- servo taps (orange) -->
    <g stroke="#e8710a">
      <line x1="250" y1="150" x2="330" y2="150"/><line x1="370" y1="150" x2="440" y2="150"/>
      <line x1="250" y1="185" x2="330" y2="185"/><line x1="370" y1="185" x2="440" y2="185"/>
      <line x1="250" y1="220" x2="330" y2="220"/><line x1="370" y1="220" x2="440" y2="220"/>
      <line x1="250" y1="255" x2="330" y2="255"/><line x1="370" y1="255" x2="440" y2="255"/>
    </g>
    <!-- S.Port (teal) -->
    <g stroke="#138d90">
      <line x1="250" y1="300" x2="330" y2="300"/><line x1="370" y1="300" x2="440" y2="300"/>
    </g>
    <!-- receiver BEC + to 5V (red) and divider -->
    <g stroke="#d62728">
      <line x1="250" y1="345" x2="440" y2="345"/>
      <line x1="400" y1="345" x2="400" y2="362"/>
      <line x1="400" y1="398" x2="400" y2="410"/>
    </g>
    <!-- ADC node (brown) -->
    <g stroke="#8c564b">
      <line x1="400" y1="410" x2="440" y2="410"/>
      <line x1="400" y1="410" x2="400" y2="422"/>
    </g>
    <!-- ground (dark) -->
    <g stroke="#333333">
      <line x1="400" y1="458" x2="400" y2="470"/>
      <line x1="250" y1="470" x2="440" y2="470"/>
      <line x1="660" y1="160" x2="820" y2="160"/>
      <line x1="760" y1="160" x2="760" y2="525"/>
      <line x1="760" y1="365" x2="820" y2="365"/>
      <line x1="760" y1="525" x2="820" y2="525"/>
      <line x1="120" y1="565" x2="120" y2="585"/>
    </g>
    <!-- 3V3 (red) -->
    <g stroke="#d62728">
      <line x1="660" y1="130" x2="820" y2="130"/>
      <line x1="740" y1="130" x2="740" y2="495"/>
      <line x1="740" y1="335" x2="820" y2="335"/>
      <line x1="740" y1="495" x2="820" y2="495"/>
    </g>
    <!-- I2C (blue) -->
    <g stroke="#1f77b4">
      <line x1="660" y1="220" x2="820" y2="220"/>
      <line x1="660" y1="255" x2="820" y2="255"/>
    </g>
    <!-- UART (green) -->
    <g stroke="#2ca02c">
      <line x1="660" y1="400" x2="820" y2="400"/>
      <line x1="660" y1="430" x2="820" y2="430"/>
    </g>
    <!-- SPI (purple) -->
    <g stroke="#7b4fb0">
      <line x1="660" y1="560" x2="820" y2="560"/>
      <line x1="660" y1="590" x2="820" y2="590"/>
      <line x1="660" y1="620" x2="820" y2="620"/>
      <line x1="660" y1="650" x2="820" y2="650"/>
    </g>
    <!-- button (grey) -->
    <g stroke="#666666">
      <line x1="250" y1="530" x2="440" y2="530"/>
    </g>
    <!-- LiPo to BAT pads -->
    <line x1="520" y1="700" x2="520" y2="740" stroke="#d62728"/>
    <line x1="580" y1="700" x2="580" y2="740" stroke="#333333"/>
  </g>

  <!-- junction dots -->
  <g stroke="none">
    <circle cx="400" cy="345" r="4.5" fill="#d62728"/>
    <circle cx="400" cy="410" r="4.5" fill="#8c564b"/>
    <circle cx="400" cy="470" r="4.5" fill="#333333"/>
    <circle cx="740" cy="130" r="4.5" fill="#d62728"/>
    <circle cx="740" cy="335" r="4.5" fill="#d62728"/>
    <circle cx="760" cy="160" r="4.5" fill="#333333"/>
    <circle cx="760" cy="365" r="4.5" fill="#333333"/>
  </g>

  <!-- ===================== resistors ===================== -->
  <g fill="#ffffff" stroke="#111111" stroke-width="1.5">
    <rect x="330" y="143" width="40" height="14" rx="2"/>
    <rect x="330" y="178" width="40" height="14" rx="2"/>
    <rect x="330" y="213" width="40" height="14" rx="2"/>
    <rect x="330" y="248" width="40" height="14" rx="2"/>
    <rect x="330" y="293" width="40" height="14" rx="2"/>
    <rect x="393" y="362" width="14" height="36" rx="2"/>
    <rect x="393" y="422" width="14" height="36" rx="2"/>
  </g>
  <g font-size="12" fill="#111111">
    <text x="335" y="138">10 kΩ</text>
    <text x="337" y="288">1 kΩ</text>
    <text x="352" y="385">100 kΩ</text>
    <text x="359" y="445">47 kΩ</text>
  </g>
  <text x="320" y="276" font-size="11" fill="#555555">each tap: 10 kΩ</text>

  <!-- ===================== receiver ===================== -->
  <rect x="40" y="110" width="210" height="380" rx="8" fill="#fff4e8" stroke="#b35900" stroke-width="2"/>
  <text x="56" y="100" font-weight="bold" fill="#111111">RC receiver</text>
  <g fill="#111111">
    <text x="56" y="155">CH1 signal: rudder</text>
    <text x="56" y="190">CH2 signal: sheet</text>
    <text x="56" y="225">CH3 signal: aux1 (opt.)</text>
    <text x="56" y="260">CH4 signal: aux2 (opt.)</text>
    <text x="56" y="305">S.Port (opt., FrSky)</text>
    <text x="56" y="350">+ (BEC 4.8-5.5 V)</text>
    <text x="56" y="475">− (ground)</text>
  </g>
  <text x="56" y="390" font-size="12" fill="#555555">Tap the signal wires with</text>
  <text x="56" y="406" font-size="12" fill="#555555">Y-leads; servos stay on the</text>
  <text x="56" y="422" font-size="12" fill="#555555">receiver as before. Taps are</text>
  <text x="56" y="438" font-size="12" fill="#555555">inputs only (high impedance).</text>

  <!-- ===================== button ===================== -->
  <rect x="40" y="505" width="210" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <text x="56" y="530" fill="#111111">Event button / reed switch</text>
  <text x="56" y="550" font-size="12" fill="#555555">to GND, internal pull-up</text>
  <g stroke="#333333" stroke-width="2.5">
    <line x1="104" y1="585" x2="136" y2="585"/>
    <line x1="110" y1="591" x2="130" y2="591"/>
    <line x1="116" y1="597" x2="124" y2="597"/>
  </g>
  <text x="142" y="595" font-size="12" fill="#555555">GND</text>

  <!-- ===================== XIAO ===================== -->
  <rect x="440" y="100" width="220" height="600" rx="10" fill="#e9f0f8" stroke="#1d3f66" stroke-width="2.5"/>
  <rect x="520" y="86" width="60" height="18" rx="4" fill="#9aa7b5" stroke="#1d3f66" stroke-width="1.5"/>
  <text x="530" y="99" font-size="11" fill="#111111">USB-C</text>
  <text x="550" y="497" text-anchor="middle" font-weight="bold" font-size="17" fill="#111111">XIAO</text>
  <text x="550" y="517" text-anchor="middle" font-weight="bold" font-size="17" fill="#111111">ESP32S3</text>
  <text x="550" y="552" text-anchor="middle" font-size="12" fill="#444444">21 × 17.8 mm, ~3 g</text>
  <g font-size="12.5" fill="#111111">
    <text x="448" y="154">D0 · GPIO1</text>
    <text x="448" y="189">D1 · GPIO2</text>
    <text x="448" y="224">GPIO39 pad</text>
    <text x="448" y="259">GPIO40 pad</text>
    <text x="448" y="304">GPIO42 pad</text>
    <text x="448" y="349">5V</text>
    <text x="448" y="414">D3 · GPIO4 ADC</text>
    <text x="448" y="474">GND</text>
    <text x="448" y="534">GPIO41 pad</text>
    <text x="652" y="134" text-anchor="end">3V3</text>
    <text x="652" y="164" text-anchor="end">GND</text>
    <text x="652" y="224" text-anchor="end">D4 · GPIO5 SDA</text>
    <text x="652" y="259" text-anchor="end">D5 · GPIO6 SCL</text>
    <text x="652" y="404" text-anchor="end">D7 · GPIO44 RX</text>
    <text x="652" y="434" text-anchor="end">D6 · GPIO43 TX</text>
    <text x="652" y="564" text-anchor="end">D2 · GPIO3 CS</text>
    <text x="652" y="594" text-anchor="end">D8 · GPIO7 SCK</text>
    <text x="652" y="624" text-anchor="end">D9 · GPIO8 MISO</text>
    <text x="652" y="654" text-anchor="end">D10 · GPIO9 MOSI</text>
    <text x="500" y="692">BAT+</text>
    <text x="565" y="692">BAT−</text>
  </g>
  <text x="550" y="470" text-anchor="middle" font-size="12" fill="#444444">LED: GPIO21 (on board)</text>
  <g fill="#1d3f66" stroke="none">
    <circle cx="440" cy="150" r="4"/><circle cx="440" cy="185" r="4"/><circle cx="440" cy="220" r="4"/>
    <circle cx="440" cy="255" r="4"/><circle cx="440" cy="300" r="4"/><circle cx="440" cy="345" r="4"/>
    <circle cx="440" cy="410" r="4"/><circle cx="440" cy="470" r="4"/><circle cx="440" cy="530" r="4"/>
    <circle cx="660" cy="130" r="4"/><circle cx="660" cy="160" r="4"/><circle cx="660" cy="220" r="4"/>
    <circle cx="660" cy="255" r="4"/><circle cx="660" cy="400" r="4"/><circle cx="660" cy="430" r="4"/>
    <circle cx="660" cy="560" r="4"/><circle cx="660" cy="590" r="4"/><circle cx="660" cy="620" r="4"/>
    <circle cx="660" cy="650" r="4"/><circle cx="520" cy="700" r="4"/><circle cx="580" cy="700" r="4"/>
  </g>

  <!-- ===================== IMU ===================== -->
  <rect x="820" y="110" width="240" height="170" rx="8" fill="#eaf3fb" stroke="#1f77b4" stroke-width="2"/>
  <text x="836" y="100" font-weight="bold" fill="#111111">IMU: BNO085 / BNO086 (I²C)</text>
  <g fill="#111111">
    <text x="836" y="134">VIN (3.3 V)</text>
    <text x="836" y="164">GND</text>
    <text x="836" y="224">SDA</text>
    <text x="836" y="259">SCL</text>
  </g>
  <text x="905" y="190" font-size="12" fill="#555555">flat, on the centreline,</text>
  <text x="905" y="206" font-size="12" fill="#555555">&gt;10 cm from servos/steel</text>

  <!-- ===================== GNSS ===================== -->
  <rect x="820" y="310" width="240" height="140" rx="8" fill="#edf7ec" stroke="#2ca02c" stroke-width="2"/>
  <text x="836" y="302" font-weight="bold" fill="#111111">GNSS: u-blox M10 (UART)</text>
  <g fill="#111111">
    <text x="836" y="339">VCC (3.3 V)</text>
    <text x="836" y="369">GND</text>
    <text x="836" y="404">TX → logger RX</text>
    <text x="836" y="434">RX ← logger TX</text>
  </g>
  <text x="945" y="339" font-size="12" fill="#555555">antenna up,</text>
  <text x="945" y="355" font-size="12" fill="#555555">no carbon above</text>

  <!-- ===================== SD ===================== -->
  <rect x="820" y="470" width="240" height="200" rx="8" fill="#f3eefa" stroke="#7b4fb0" stroke-width="2"/>
  <text x="836" y="462" font-weight="bold" fill="#111111">microSD (SPI, 3.3 V-only board)</text>
  <g fill="#111111">
    <text x="836" y="499">3V3</text>
    <text x="836" y="529">GND</text>
    <text x="836" y="564">CS</text>
    <text x="836" y="594">SCK / CLK</text>
    <text x="836" y="624">MISO / DO</text>
    <text x="836" y="654">MOSI / DI</text>
  </g>

  <!-- ===================== LiPo ===================== -->
  <rect x="440" y="740" width="220" height="70" rx="8" fill="#fdecec" stroke="#d62728" stroke-width="2"/>
  <text x="456" y="765" font-weight="bold" fill="#111111">Option B: own 1S LiPo</text>
  <text x="456" y="784" font-size="12" fill="#444444">300-500 mAh on BAT pads, charged</text>
  <text x="456" y="800" font-size="12" fill="#444444">by the XIAO over USB-C</text>
  <text x="30" y="640" font-size="12" fill="#444444">Power: option A = BEC → Schottky → 5V</text>
  <text x="30" y="656" font-size="12" fill="#444444">(≤5.5 V; use a small buck for HV/2S).</text>
  <text x="30" y="672" font-size="12" fill="#444444">Option B = own cell; keep GND common</text>
  <text x="30" y="688" font-size="12" fill="#444444">with the receiver for the servo taps.</text>
  <text x="30" y="712" font-size="12" fill="#444444">Divider 100k/47k measures the 5V/BEC</text>
  <text x="30" y="728" font-size="12" fill="#444444">input (vbat_scale = 3.128). For option B</text>
  <text x="30" y="744" font-size="12" fill="#444444">feed its top from BAT+ instead.</text>

  <!-- ===================== legend ===================== -->
  <rect x="700" y="700" width="360" height="130" rx="8" fill="#fafafa" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="716" y="722" font-weight="bold" fill="#111111">Wire colours</text>
  <g stroke-width="4" stroke-linecap="round">
    <line x1="716" y1="742" x2="746" y2="742" stroke="#d62728"/>
    <line x1="716" y1="764" x2="746" y2="764" stroke="#333333"/>
    <line x1="716" y1="786" x2="746" y2="786" stroke="#1f77b4"/>
    <line x1="716" y1="808" x2="746" y2="808" stroke="#2ca02c"/>
    <line x1="886" y1="742" x2="916" y2="742" stroke="#7b4fb0"/>
    <line x1="886" y1="764" x2="916" y2="764" stroke="#e8710a"/>
    <line x1="886" y1="786" x2="916" y2="786" stroke="#138d90"/>
    <line x1="886" y1="808" x2="916" y2="808" stroke="#8c564b"/>
  </g>
  <g font-size="12.5" fill="#111111">
    <text x="754" y="746">power</text>
    <text x="754" y="768">ground</text>
    <text x="754" y="790">I²C</text>
    <text x="754" y="812">UART (GNSS)</text>
    <text x="924" y="746">SPI (SD card)</text>
    <text x="924" y="768">servo taps (inputs)</text>
    <text x="924" y="790">S.Port (optional)</text>
    <text x="924" y="812">battery sense</text>
  </g>
</svg>
